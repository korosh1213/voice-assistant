name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Download Persian model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip
          unzip -q model.zip
          mv vosk-model-small-fa-0.42 app/src/main/assets/model
          echo "persian-1" > app/src/main/assets/model/uuid
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk
